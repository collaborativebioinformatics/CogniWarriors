<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arm-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arm-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
    <marker id="arm-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arm-violet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Federated Learning Architecture</text>
  <text x="600" y="64" text-anchor="middle" font-size="14" fill="#64748b">NVIDIA FLARE 2.9 · FedAvg · raw data never leaves a center</text>

  <!-- ===== FLARE Server ===== -->
  <rect x="430" y="110" width="340" height="300" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="430" y="110" width="340" height="46" rx="14" fill="#1d4ed8"/>
  <rect x="430" y="134" width="340" height="22" fill="#1d4ed8"/>
  <text x="600" y="139" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">FLARE Server</text>

  <text x="600" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">FedAvg aggregation</text>
  <text x="600" y="212" text-anchor="middle" font-size="12" fill="#334155">weighted by training-session count</text>

  <line x1="452" y1="232" x2="748" y2="232" stroke="#cbd5e1"/>

  <text x="600" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Global feature scaling (once)</text>
  <text x="600" y="278" text-anchor="middle" font-size="12" fill="#334155">combines per-site sums → shared mean/std</text>

  <line x1="452" y1="296" x2="748" y2="296" stroke="#cbd5e1"/>

  <text x="600" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Best model + early stopping</text>
  <text x="600" y="342" text-anchor="middle" font-size="12" fill="#334155">tracks weighted validation MSE</text>

  <rect x="452" y="362" width="296" height="32" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-dasharray="4 3"/>
  <text x="600" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Global model: FedFusionModel</text>

  <!-- ===== Site 1 ===== -->
  <rect x="40" y="130" width="300" height="260" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <rect x="40" y="130" width="300" height="46" rx="14" fill="#047857"/>
  <rect x="40" y="154" width="300" height="22" fill="#047857"/>
  <text x="190" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Site 1</text>

  <text x="190" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Local data — private</text>
  <text x="190" y="232" text-anchor="middle" font-size="12" fill="#334155">phenotype features + image embeddings</text>

  <line x1="62" y1="252" x2="318" y2="252" stroke="#cbd5e1"/>

  <text x="190" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Local training</text>
  <text x="190" y="298" text-anchor="middle" font-size="12" fill="#334155">a few epochs on local data only</text>

  <line x1="62" y1="316" x2="318" y2="316" stroke="#cbd5e1"/>

  <text x="190" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Sends back</text>
  <text x="190" y="362" text-anchor="middle" font-size="12" fill="#334155">weights · metrics · session count</text>

  <!-- ===== Site N ===== -->
  <rect x="860" y="130" width="300" height="260" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="860" y="130" width="300" height="46" rx="14" fill="#047857"/>
  <rect x="860" y="154" width="300" height="22" fill="#047857"/>
  <text x="1010" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Site N</text>

  <text x="1010" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Local data — private</text>
  <text x="1010" y="232" text-anchor="middle" font-size="12" fill="#334155">phenotype features + image embeddings</text>

  <line x1="882" y1="252" x2="1138" y2="252" stroke="#cbd5e1"/>

  <text x="1010" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Local training</text>
  <text x="1010" y="298" text-anchor="middle" font-size="12" fill="#334155">a few epochs on local data only</text>

  <line x1="882" y1="316" x2="1138" y2="316" stroke="#cbd5e1"/>

  <text x="1010" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Sends back</text>
  <text x="1010" y="362" text-anchor="middle" font-size="12" fill="#334155">weights · metrics · session count</text>

  <!-- ===== Arrows between server and sites ===== -->
  <line x1="430" y1="190" x2="342" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arm-blue)"/>
  <text x="386" y="180" text-anchor="middle" font-size="11" fill="#475569">global weights</text>
  <line x1="770" y1="190" x2="858" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arm-blue)"/>
  <text x="814" y="180" text-anchor="middle" font-size="11" fill="#475569">global weights</text>

  <line x1="340" y1="300" x2="428" y2="300" stroke="#047857" stroke-width="2" marker-end="url(#arm-green)"/>
  <text x="384" y="290" text-anchor="middle" font-size="11" fill="#475569">local updates</text>
  <line x1="860" y1="300" x2="772" y2="300" stroke="#047857" stroke-width="2" marker-end="url(#arm-green)"/>
  <text x="816" y="290" text-anchor="middle" font-size="11" fill="#475569">local updates</text>

  <line x1="340" y1="360" x2="428" y2="360" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arm-gray)"/>
  <text x="384" y="350" text-anchor="middle" font-size="11" fill="#94a3b8">column sums (once)</text>
  <line x1="860" y1="360" x2="772" y2="360" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arm-gray)"/>
  <text x="816" y="350" text-anchor="middle" font-size="11" fill="#94a3b8">column sums (once)</text>

  <!-- ===== Data sources ===== -->
  <rect x="300" y="460" width="600" height="76" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Data sources → per-site split</text>
  <text x="600" y="507" text-anchor="middle" font-size="12" fill="#4c1d95">ds007089 (FreeSurfer MRI) + ds007116 (phenotypes)</text>
  <text x="600" y="525" text-anchor="middle" font-size="12" fill="#4c1d95">prepare_site_data.py splits by participant → one folder per site</text>

  <line x1="190" y1="460" x2="190" y2="392" stroke="#7c3aed" stroke-width="2" marker-end="url(#arm-violet)"/>
  <text x="255" y="430" text-anchor="middle" font-size="11" fill="#7c3aed">per-site data</text>
  <line x1="1010" y1="460" x2="1010" y2="392" stroke="#7c3aed" stroke-width="2" marker-end="url(#arm-violet)"/>
  <text x="945" y="430" text-anchor="middle" font-size="11" fill="#7c3aed">per-site data</text>

  <!-- ===== Result line ===== -->
  <text x="600" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Result: FedAvg R² = 0.265 ± 0.042 (centralized 0.273 ± 0.055) — federation recovers almost all pooled-data performance</text>
</svg>