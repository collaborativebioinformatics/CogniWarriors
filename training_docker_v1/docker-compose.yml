name: training

services:
  training-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    image: nvidia-hackathon-flare-dashboard:latest
    container_name: training-monitor
    command: uvicorn monitor_app.main:app --host 0.0.0.0 --port 8080
    environment:
      NBBH_DATA_ROOT: /data
      FLARE_OUTPUT_DIR: /flare_outputs
      FLARE_DEFAULT_SITES: "2"
      FLARE_DEFAULT_ROUNDS: "2"
      FLARE_DEFAULT_LOCAL_EPOCHS: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
      - ./flare_outputs:/flare_outputs
